[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/"
]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 10000
max_test_rejects = 65536
dictionary_weight = 80
include_storage = true

[profile.default.invariant]
runs = 1000
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 65536 }
invariant = { runs = 1000, depth = 64 }

[profile.fuzz]
fuzz = { runs = 10000, max_test_rejects = 65536 }
invariant = { runs = 2000, depth = 128 }
