name: ZENITH Protocol CI

on:
  push:
    branches: 
      - main
      - fix/zenith-v3-execution
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Protocol Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'npm'

      - name: Verify Node runtime
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) process.exit(1); const { DatabaseSync } = require('node:sqlite'); if (typeof DatabaseSync !== 'function') process.exit(1); console.log('Node runtime and DatabaseSync verified:', process.version)"

      - name: Install Dependencies
        run: npm ci

      - name: Anti-Mock & Secret Audit Gate
        run: npm run audit:anti-mock

      - name: Security & Vulnerability Audit Gate
        run: npm run audit:security

      - name: TypeScript Type-Check Gate
        run: npm run type-check

      - name: Lint Gate
        run: npm run lint

      - name: Protocol Test Suite (All Disciplines)
        run: npm test

      - name: Production Web Application Build Gate
        run: npm run build

